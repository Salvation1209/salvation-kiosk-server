<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salvation Nexus Wallet</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #050505; color: #f8fafc; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .wallet-card { background: #121212; padding: 50px 30px; border-radius: 6px; border: 1px solid #262626; box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 85%; max-width: 400px; }
        h1 { font-size: 1rem; margin-bottom: 10px; font-weight: 500; color: #737373; text-transform: uppercase; letter-spacing: 4px; }
        .amount { font-size: 4rem; font-weight: 200; margin-bottom: 40px; color: #ffffff; letter-spacing: -2px; }
        
        .pay-btn { background-color: #b91c1c; color: white; border: none; padding: 20px; width: 100%; font-size: 1.1rem; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s; }
        .pay-btn:active { background-color: #991b1b; transform: scale(0.98); }
        
        #processing, #success { display: none; }
        
        .spinner { border: 3px solid #262626; border-top: 3px solid #dc2626; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .check { font-size: 4rem; color: #dc2626; margin-bottom: 15px; }
        .status-text { font-size: 1.2rem; font-weight: 300; letter-spacing: 1px; color: #d4d4d8; }
    </style>
</head>
<body>

    <!-- Checkout Screen -->
    <div id="checkout" class="wallet-card">
        <h1>Salvation Inc.</h1>
        <div class="amount" id="display-amount">$0.00</div>
        <button class="pay-btn" onclick="confirmPayment()">Authorize</button>
    </div>

    <!-- Processing Screen (NEW DELAY FEATURE) -->
    <div id="processing" class="wallet-card">
        <h1>Salvation Nexus</h1>
        <div class="spinner"></div>
        <div class="status-text" style="color: #737373; font-size: 0.9rem; text-transform: uppercase;">Establishing secure uplink...</div>
    </div>

    <!-- Success Screen -->
    <div id="success" class="wallet-card">
        <div class="check">◆</div>
        <div class="status-text">FUNDS CLEARED</div>
        <p style="color: #525252; font-size: 0.85rem; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;">Session closed automatically.</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const urlParams = new URLSearchParams(window.location.search);
        const amountCents = urlParams.get('amount') || 0;
        const sessionId = urlParams.get('session');

        document.getElementById('display-amount').innerText = "$" + (amountCents / 100).toFixed(2);

        function confirmPayment() {
            // 1. Hide checkout button and show the spinning processing screen
            document.getElementById('checkout').style.display = 'none';
            document.getElementById('processing').style.display = 'block';

            // 2. Wait exactly 3 seconds before acting (The Delay)
            setTimeout(() => {
                // 3. Ping the server
                socket.emit('qr_payment_confirmed', { session: sessionId });
                
                // 4. Show success screen on the phone
                document.getElementById('processing').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            }, 3000); 
        }
    </script>
</body>
</html>
